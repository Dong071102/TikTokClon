name: Build & Deploy to Portainer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
          JWT_SECRET: "mock_secret_for_ci"

  trigger-portainer:
    name: Trigger Portainer Webhook Redeploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Call Portainer Stack Webhook
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK" ]; then
            echo "Kích hoạt Portainer Webhook để tự động pull code và redeploy stack..."
            curl -k -X POST "$PORTAINER_WEBHOOK"
            echo "Đã gửi tín hiệu redeploy tới Portainer thành công!"
          else
            echo "Chưa cấu hình PORTAINER_WEBHOOK_URL trong GitHub Secrets. Nếu dùng Portainer Polling định kỳ thì không cần bước này."
          fi
